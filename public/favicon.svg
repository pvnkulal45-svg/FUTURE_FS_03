<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="faviconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D779" />
      <stop offset="50%" stop-color="#D99B26" />
      <stop offset="100%" stop-color="#B88019" />
    </linearGradient>
    <linearGradient id="faviconChoc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B2314" />
      <stop offset="100%" stop-color="#24140C" />
    </linearGradient>
  </defs>

  <!-- Outer Golden Ring -->
  <circle cx="32" cy="32" r="30" fill="url(#faviconChoc)" stroke="url(#faviconGold)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#faviconGold)" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.6" />

  <!-- Left Golden Wheat Stalk -->
  <g fill="url(#faviconGold)">
    <!-- Wheat stem -->
    <path d="M 23 44 C 21 37 21 27 24 18" stroke="url(#faviconGold)" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <!-- Wheat grains left side -->
    <path d="M 23 40 C 20 39 18 36 20 34 C 22 35 23 38 23 40 Z" />
    <path d="M 22 34 C 18 33 17 29 20 28 C 22 29 23 32 22 34 Z" />
    <path d="M 23 28 C 19 26 19 22 22 21 C 24 23 24 26 23 28 Z" />
    <path d="M 24 21 C 22 18 23 15 25 15 C 26 17 26 20 24 21 Z" />
  </g>

  <!-- Right Golden Wheat Stalk -->
  <g fill="url(#faviconGold)">
    <!-- Wheat stem -->
    <path d="M 41 44 C 43 37 43 27 40 18" stroke="url(#faviconGold)" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <!-- Wheat grains right side -->
    <path d="M 41 40 C 44 39 46 36 44 34 C 42 35 41 38 41 40 Z" />
    <path d="M 42 34 C 46 33 47 29 44 28 C 42 29 41 32 42 34 Z" />
    <path d="M 41 28 C 45 26 45 22 42 21 C 40 23 40 26 41 28 Z" />
    <path d="M 40 21 C 42 18 41 15 39 15 C 38 17 38 20 40 21 Z" />
  </g>

  <!-- Center Artisan Bread Loaf & Celebration Cake Silhouette -->
  <!-- Cake Base Tier -->
  <rect x="26" y="36" width="12" height="7" rx="1.5" fill="url(#faviconGold)" />
  <rect x="27.5" y="38" width="9" height="1.2" rx="0.6" fill="#24140C" opacity="0.4" />

  <!-- Artisan Dome Crust / Cake Top -->
  <path d="M 27 34 C 27 28 37 28 37 34 Z" fill="url(#faviconGold)" />
  <!-- Baker's Slash Scores -->
  <path d="M 29.5 32 Q 32 30 34.5 32" stroke="#24140C" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Top Star / Flourish -->
  <circle cx="32" cy="22" r="1.5" fill="url(#faviconGold)" />
  <circle cx="28.5" cy="24" r="1" fill="url(#faviconGold)" />
  <circle cx="35.5" cy="24" r="1" fill="url(#faviconGold)" />

  <!-- Lower Base Ribbon Line -->
  <path d="M 22 46 Q 32 49 42 46" stroke="url(#faviconGold)" stroke-width="1.2" fill="none" stroke-linecap="round" />
</svg>