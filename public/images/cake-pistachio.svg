<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgPist" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#222b1e" />
      <stop offset="100%" stop-color="#0f140c" />
    </radialGradient>
    <linearGradient id="pistachioBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a8d62" />
      <stop offset="50%" stop-color="#8fa373" />
      <stop offset="100%" stop-color="#677752" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b0" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#936d15" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bgPist)" rx="24" />
  
  <!-- Stand -->
  <ellipse cx="300" cy="510" rx="190" ry="24" fill="#070a06" opacity="0.7" />
  <ellipse cx="300" cy="495" rx="175" ry="17" fill="url(#goldShine)" />
  <path d="M 270 495 L 285 535 L 315 535 L 330 495 Z" fill="url(#goldShine)" />
  <ellipse cx="300" cy="535" rx="70" ry="12" fill="url(#goldShine)" />

  <!-- Multi-layer rectangular/cylindrical Opera tier -->
  <path d="M 180 340 Q 300 380 420 340 L 420 450 Q 300 490 180 450 Z" fill="url(#pistachioBody)" />
  <ellipse cx="300" cy="340" rx="120" ry="30" fill="#9db380" stroke="url(#goldShine)" stroke-width="1.5" />

  <!-- Opera chocolate layer stripe -->
  <path d="M 180 395 Q 300 435 420 395 L 420 410 Q 300 450 180 410 Z" fill="#2d1d14" />

  <!-- Upper tier -->
  <path d="M 220 220 Q 300 255 380 220 L 380 310 Q 300 345 220 310 Z" fill="url(#pistachioBody)" />
  <ellipse cx="300" cy="220" rx="80" ry="22" fill="#9db380" stroke="url(#goldShine)" stroke-width="2" />
  <path d="M 220 265 Q 300 300 380 265 L 380 275 Q 300 310 220 275 Z" fill="#2d1d14" />

  <!-- Pistachio Macarons on top -->
  <ellipse cx="270" cy="205" rx="18" ry="10" fill="#a4b888" stroke="url(#goldShine)" stroke-width="1" />
  <ellipse cx="330" cy="205" rx="18" ry="10" fill="#a4b888" stroke="url(#goldShine)" stroke-width="1" />
  <ellipse cx="300" cy="185" rx="20" ry="11" fill="#75885e" stroke="url(#goldShine)" stroke-width="1.5" />

  <!-- Gold leaf & crushed roasted pistachio crumble -->
  <g fill="url(#goldShine)">
    <polygon points="295,160 302,163 299,170 292,167" />
    <circle cx="260" cy="218" r="3" />
    <circle cx="340" cy="216" r="3" />
    <circle cx="285" cy="225" r="2.5" />
    <circle cx="315" cy="223" r="2.5" />
    <polygon points="245,330 252,333 249,339 242,336" />
    <polygon points="360,332 367,335 363,342 356,338" />
  </g>

  <text x="300" y="565" font-family="'Cormorant Garamond', serif" font-size="19" font-weight="700" letter-spacing="3" fill="#d4af37" text-anchor="middle">SICILIAN PISTACHIO OPERA</text>
</svg>
