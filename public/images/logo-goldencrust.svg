<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoWheatGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#D99B26" />
      <stop offset="100%" stop-color="#B88019" />
    </linearGradient>
    <linearGradient id="logoChocBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2215" />
      <stop offset="100%" stop-color="#24140C" />
    </linearGradient>
  </defs>

  <!-- Outer Crest Ring -->
  <circle cx="100" cy="100" r="92" fill="url(#logoChocBg)" stroke="url(#logoWheatGold)" stroke-width="4.5" />
  <circle cx="100" cy="100" r="83" fill="none" stroke="url(#logoWheatGold)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Left Golden Wheat Stalk (Refined Botanical Grains) -->
  <g fill="url(#logoWheatGold)">
    <path d="M 68 140 C 60 115 58 80 72 52" stroke="url(#logoWheatGold)" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 68 128 C 55 125 50 115 57 108 C 65 112 68 120 68 128 Z" />
    <path d="M 64 108 C 50 105 48 93 57 90 C 65 94 67 102 64 108 Z" />
    <path d="M 67 90 C 53 85 52 71 63 68 C 69 73 70 84 67 90 Z" />
    <path d="M 72 68 C 61 58 66 45 75 47 C 78 53 76 63 72 68 Z" />
  </g>

  <!-- Right Golden Wheat Stalk (Refined Botanical Grains) -->
  <g fill="url(#logoWheatGold)">
    <path d="M 132 140 C 140 115 142 80 128 52" stroke="url(#logoWheatGold)" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 132 128 C 145 125 150 115 143 108 C 135 112 132 120 132 128 Z" />
    <path d="M 136 108 C 150 105 152 93 143 90 C 135 94 133 102 136 108 Z" />
    <path d="M 133 90 C 147 85 148 71 137 68 C 131 73 130 84 133 90 Z" />
    <path d="M 128 68 C 139 58 134 45 125 47 C 122 53 124 63 128 68 Z" />
  </g>

  <!-- Center Artisan Bread Loaf & Celebration Cake Silhouette -->
  <!-- Cake Tier Base -->
  <rect x="78" y="112" width="44" height="25" rx="4.5" fill="url(#logoWheatGold)" />
  <rect x="83" y="120" width="34" height="3" rx="1.5" fill="#24140C" opacity="0.35" />

  <!-- Artisan Dome Crust / Cake Top -->
  <path d="M 81 107 C 81 85 119 85 119 107 Z" fill="url(#logoWheatGold)" />
  <!-- Baker's Slash Scores -->
  <path d="M 89 100 Q 100 93 111 100" stroke="#24140C" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.65" />

  <!-- Baker's Crown Stars -->
  <circle cx="100" cy="68" r="4.5" fill="url(#logoWheatGold)" />
  <circle cx="90" cy="74" r="3" fill="url(#logoWheatGold)" />
  <circle cx="110" cy="74" r="3" fill="url(#logoWheatGold)" />

  <!-- Lower Base Ribbon -->
  <path d="M 66 148 Q 100 158 134 148" stroke="url(#logoWheatGold)" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Brand Arc Monogram -->
  <text x="100" y="169" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" letter-spacing="3.5" fill="#FDE68A" text-anchor="middle">GOLDEN CRUST</text>
</svg>
